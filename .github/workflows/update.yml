name: Monthly Directory Update

on:
  schedule:
    # Runs at 9am AEST (11pm UTC) on the 1st of every month
    - cron: "0 23 1 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  update-directory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run crawler
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: cd crawler && python crawler.py

      - name: Build site
        run: python build.py

      - name: Commit and push updates
        run: |
          git config user.name "Directory Bot"
          git config user.email "bot@skylostudios.com"
          git add data/ site/
          git diff --staged --quiet || (git commit -m "Monthly directory update $(date +'%Y-%m-%d')" && git push)
